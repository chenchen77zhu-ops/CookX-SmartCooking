name: Temperature module
on:
  pull_request:
    paths:
      - 'frontend/**'
      - 'firmware/**'
      - 'app/**'
      - 'tests/**'
      - 'requirements*.txt'
      - 'research/temperature/**'
      - '.github/workflows/temperature.yml'
  push:
    branches: [main, feat/temperature-intelligence, fix/latest-software-acceptance]
    paths:
      - 'frontend/**'
      - 'firmware/**'
      - 'app/**'
      - 'tests/**'
      - 'requirements*.txt'
      - 'research/temperature/**'
      - '.github/workflows/temperature.yml'
permissions:
  contents: read
jobs:
  app:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - name: Dependencies and unit tests
        working-directory: frontend
        run: |
          npm ci --registry=https://registry.npmjs.org
          npm test
          npm run build
          npx cap sync android
      - name: Android SDK
        run: sdkmanager "platforms;android-36" "build-tools;35.0.0"
      - name: Android build and unit tests
        working-directory: frontend/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug testDebugUnitTest --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: CookX-temperature-debug
          path: frontend/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
  simulation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install numpy==2.4.4
      - run: python -m unittest discover -s research/temperature -p "test_*.py"
  backend:
    runs-on: ubuntu-latest
    env:
      DEEPSEEK_API_KEY: test-placeholder-not-a-real-key
      DASHSCOPE_API_KEY: test-placeholder-not-a-real-key
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-test.txt
      - run: python -m pytest tests -q
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Production browser dependencies
        run: |
          npm ci --prefix frontend --registry=https://registry.npmjs.org
          npm run build --prefix frontend
          npm install --prefix "$RUNNER_TEMP/cookx-browser" playwright@1.62.1 --registry=https://registry.npmjs.org
          node "$RUNNER_TEMP/cookx-browser/node_modules/playwright/cli.js" install --with-deps chromium
      - name: Browser and API acceptance
        env:
          COOKX_BASE_URL: http://127.0.0.1:4173
        run: |
          export COOKX_PLAYWRIGHT="$RUNNER_TEMP/cookx-browser/node_modules/playwright"
          python tests/sqlite_browser_server.py > /tmp/cookx-sqlite.log 2>&1 &
          python tests/browser_server.py > /tmp/cookx-backend.log 2>&1 &
          BACKEND_PID=$!
          npm run preview --prefix frontend -- --host 127.0.0.1 > /tmp/cookx-frontend.log 2>&1 &
          FRONTEND_PID=$!
          trap 'kill "$BACKEND_PID" "$FRONTEND_PID" 2>/dev/null || true' EXIT
          python - <<'PY'
          import time, urllib.request
          for address in ['http://127.0.0.1:8000/', 'http://127.0.0.1:4173/']:
              for attempt in range(60):
                  try:
                      with urllib.request.urlopen(address, timeout=1) as response:
                          assert response.status == 200
                      break
                  except Exception:
                      time.sleep(.5)
              else:
                  raise RuntimeError('Acceptance server unavailable: '+address)
          PY
          node research/temperature/browser-parity.cjs
          node research/temperature/browser-smoke.cjs
          node research/temperature/browser-application.cjs
          node frontend/scripts/browser-p2.cjs
          node frontend/scripts/browser-p2-flow.cjs
          node frontend/scripts/browser-p2-writes.cjs
          node frontend/scripts/browser-copilot.cjs
          node frontend/scripts/browser-online-v2.cjs
          node frontend/scripts/browser-preferences.cjs
          node frontend/scripts/browser-sqlite.cjs
          node frontend/scripts/browser-households.cjs
          node frontend/scripts/browser-shopping.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: CookX-acceptance-evidence
          path: |
            docs/temperature/*results.json
            tmp/temperature-mobile.png
            tmp/p2/
            tmp/copilot/
            tmp/online-v2/
            tmp/sqlite/
            tmp/household/
            tmp/shopping/
            /tmp/cookx-sqlite.log
            /tmp/cookx-backend.log
            /tmp/cookx-frontend.log
